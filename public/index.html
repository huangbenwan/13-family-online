<div class="bar"><h1>♠ 五人十三支 Online</h1><span><span id="tot"></span> <button id="snd" onclick="toggleSnd()" style="flex:none;padding:2px 8px;font-size:15px;margin-left:4px">🔊</button></span></div>
<div id="app"></div>
<script>
const SU=['♠','♥','♦','♣'],CAT=['散牌','一對','兩對','三條','順子','同花','同花對子','同花兩對子','葫蘆','四條','同花順','五雷'];
const LN=['頭墩','中墩','尾墩'],LS=[3,5,5],NM=['你','小明','阿花','老王','小美'];
const lb=r=>({11:'J',12:'Q',13:'K',14:'A'}[r]||r),P5=759375;
function ev(cs){
  const n=cs.length,cnt={};cs.forEach(c=>cnt[c.r]=(cnt[c.r]||0)+1);
  const g=Object.entries(cnt).map(([r,c])=>[+r,c]).sort((a,b)=>b[1]-a[1]||b[0]-a[0]);
  let rk=g.map(x=>x[0]),cn=g.map(x=>x[1]).join(''),cat=0;
  if(n==5){
    const fl=cs.every(c=>c.s==cs[0].s),rs=cs.map(c=>c.r).sort((a,b)=>b-a);
    let st=g.length==5&&rs[0]-rs[4]==4;
    if(g.length==5&&rs.join()=='14,5,4,3,2'){st=true;rk=[5]}else if(st)rk=[rs[0]];
    cat=cn=='5'?11:st&&fl?10:cn=='41'?9:cn=='32'?8:fl&&cn=='221'?7:fl&&cn=='2111'?6:fl?5:st?4:cn=='311'?3:cn=='221'?2:cn=='2111'?1:0;
  }else cat=cn=='3'?3:cn=='21'?1:0;
  if([3,8,9,11].includes(cat))rk=[rk[0]]; // 只比主要點數
  let v=cat;for(let i=0;i<5;i++)v=v*15+(rk[i]||0);return v;
}
const catOf=v=>Math.floor(v/P5);
const C5=[];for(let m=0;m<8192;m++){let k=0;for(let i=0;i<13;i++)k+=m>>i&1;if(k==5)C5.push(m)}
function auto(h){
  const pick=m=>h.filter((_,i)=>m>>i&1),v5=C5.map(m=>ev(pick(m))),f3={};
  for(const strict of [1,0]){
    let best=null,bs=-1;
    for(let a=0;a<C5.length;a++)for(let b=0;b<C5.length;b++){
      if(C5[a]&C5[b])continue;const fm=8191^C5[a]^C5[b];
      const vf=f3[fm]??=ev(pick(fm)),vt=v5[a],vm=v5[b];
      if(strict?!(vt>vm&&vm>vf):!(vt>=vm&&vm>=vf))continue;
      const s=vt+vm+vf*2;if(s>bs){bs=s;best=[fm,C5[b],C5[a]]}
    }
    if(best)return best.map(pick);
  }
}
function deck(){const d=[];let id=0;for(let s=0;s<4;s++)for(let k=0;k<(s==G.dbl?2:1);k++)for(let r=2;r<=14;r++)d.push({r,s,id:id++});
  for(let i=d.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[d[i],d[j]]=[d[j],d[i]]}return d}
const ACE=['cards/A-s.jpg','cards/A-h.jpg','cards/A-d.jpg','cards/A-c.jpg'],ACEBG=['#e4e9f5','#fbe6e6','#fcf0d2','#e7f1e0'],aceSt=c=>c.r==14?` style="background-image:url(${ACE[c.s]});background-color:${ACEBG[c.s]}"`:'';
const chip=(c,x='')=>`<div class="c ${c.s==1||c.s==2?'r':''}${c.r==G.jr?" jk":""}${c.r==14?" ace":""}" ${x}${aceSt(c)}><b>${lb(c.r)}</b><span>${SU[c.s]}</span></div>`;
const mini=(c,h)=>`<div class="c ${c.s==1||c.s==2?'r':''} ${h?'gold':''}${c.r==14?' ace':''}"${aceSt(c)}><b>${lb(c.r)}</b><span>${SU[c.s]}</span></div>`;

let G={round:0,n:5,total:[],sortMode:'rank',asc:false,sel:null,dbl:0,jr:0};
function sortHand(){const h=G.hand;if(G.sortMode=='manual')return;
  if(G.sortMode=='suit')h.sort((a,b)=>a.s-b.s||b.r-a.r);
  else h.sort((a,b)=>(G.asc?a.r-b.r:b.r-a.r)||a.s-b.s)}
function start(n){if(n){G.n=n;G.dbl=0}if(!G.round||n)G.total=Array(G.n).fill(0);
  const d=deck();G.round++;G.jr=2+Math.floor(Math.random()*13);G.swapUsed=false;G.swapMsg='';clearInterval(G.dvTimer);G.duel=false;G.dv=null;G.fxQ=[];G.fxBusy=false;G.hands=[];
  for(let i=0;i<G.n;i++)G.hands.push(d.slice(i*13,i*13+13));
  G.idle=65-G.n*13;G.hand=G.hands[0].slice();G.lanes=[[],[],[]];G.sel=null;G.res=null;
  G.status=Array(G.n).fill(0);G.bots={};G.phase='play';sortHand();render();
  const rid=G.round;
  for(let i=1;i<G.n;i++)setTimeout(()=>{if(G.round!=rid)return;G.bots[i]=auto(G.hands[i]);G.status[i]=1;check();render()},500*i+300);

    if(r){const hs=hiIds(l,k);if(fxParts(l,k).some(t=>t.startsWith('彩金')))l.forEach(x=>{if(x.r==G.jr)hs.add(x.id)});
      return `<div class="sm ${G.last==i+','+k?'new':''}">${l.map(x=>mini(x,hs.has(x.id))).join('')}${pad}<em class="${fxParts(l,k).length?'gl':''}">${LN[k]}<br>${CAT[catOf(ev(l))]}</em></div>`}
    const me=i==G.me;return `<div class="sm hid ${me?'mine':''}" ${me?`onclick="reveal(${i},${k})"`:''}>${l.map(back5).join('')}${pad}<em>${LN[k]}<br>${me?'點我攤牌'+(fxParts(l,k).length?' ✦':''):'未攤牌'}</em></div>`}).join('')+'</div>').join('')+
  (S.host==uid?'<div class="row"><button onclick="skipDuel()">全部攤開(房主)</button></div>':'')}
function inviteHTML(){return `<div class="pb"><h3>🎉 你被邀請加入房間</h3><div style="font-size:36px;font-weight:900;letter-spacing:8px;text-align:center;margin:6px 0">${G.inv}</div>
<input id="nm" maxlength="8" placeholder="輸入你的暱稱(最多 8 字)" value="${esc(myName)}" style="${INP}">
<div class="row"><button class="p" onclick="joinInvite()" ${db?'':'disabled'}>加入房間</button></div>
<div class="msg">${err||(db?'':'連線伺服器中…(免費主機喚醒可能需 30~60 秒)')}</div>
<div class="row"><button onclick="G.inv='';err='';render()">我要自己建立房間</button></div></div>`}
async function joinInvite(){if(!getName())return;await enter(G.inv)}
const inviteLink=()=>location.origin+location.pathname+'?room='+code;
const inviteText=()=>'來玩五人十三支!點連結直接加入房間 '+code+':'+inviteLink();
async function shareInvite(){const url=inviteLink();
  try{if(navigator.share){await navigator.share({title:'五人十三支',text:'來玩五人十三支!房間代碼 '+code,url});return}}catch(e){if(e&&e.name=='AbortError')return}
  try{await navigator.clipboard.writeText(inviteText());toast('✓ 邀請連結已複製,貼到 LINE 就好','ok')}catch(e){const i=document.getElementById('lnk');if(i){i.select();try{document.execCommand('copy');toast('✓ 邀請連結已複製','ok')}catch(_){toast('請長按連結框手動複製','ok')}}}}
function lineInvite(){location.href='https://line.me/R/msg/text/?'+encodeURIComponent(inviteText())}
function lobbyHTML(){const ids=Object.keys(P).sort((a,b)=>P[a].t-P[b].t),host=S.host==uid;
  return `<div class="jp" style="justify-content:space-between"><span>房間代碼</span><b style="font-size:30px;letter-spacing:6px">${code}</b><small>朋友打開同一個網址後輸入代碼</small></div>
<div class="pb"><div class="rule">邀請連結(朋友點開、輸入暱稱就能加入):</div><input id="lnk" readonly value="${inviteLink()}" onclick="this.select()" style="${INP};font-size:13px"><div class="row"><button class="p" onclick="lineInvite()">💬 傳到 LINE</button><button onclick="shareInvite()">📤 分享 / 複製</button></div></div>
<div class="pb"><h3><span>玩家(${ids.length}/5)</span></h3>${ids.map(id=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0"><span>${esc(P[id].name)}${P[id].bot?' 🤖':''}${id==S.host?' 👑':''}${id==uid?' (你)':''}</span>${host&&id!=uid?`<button style="flex:none;padding:2px 10px" onclick="kick('${id}')">✕</button>`:''}</div>`).join('')}</div>
${host?`<div class="row"><button onclick="addBot()" ${ids.length>=5?'disabled':''}>＋ 加入電腦</button><button class="p" onclick="deal()" ${ids.length<2?'disabled':''}>開始遊戲</button></div>`:'<p class="rule">等待房主開始遊戲…</p>'}
<div class="row"><button onclick="leaveRoom()">離開房間</button></div><p class="rule">目前牌組 ${compStr()}。房主需保持頁面開啟(負責發牌與結算)。</p>`}
function render(){
  const app=document.getElementById('app'),T=document.getElementById('tot');
  if(!S){T.textContent='';app.innerHTML=entryHTML();return}
  T.textContent='房間 '+code+' · 第 '+S.round+' 局';
  if(S.phase=='lobby'){app.innerHTML=lobbyHTML();return}
  if(G.me<0){app.innerHTML='<p>這一局已開始,你不在名單內。請等下一局或請房主重新開局。</p><div class="row"><button onclick="leaveRoom()">離開房間</button></div>';return}
  const mine=pd(uid);G.status=S.order.map(id=>pd(id)&&pd(id).sub?1:0);
  if(S.phase=='play'){
    if(mine&&mine.sub){if(document.activeElement&&document.activeElement.id=='utx')return;app.innerHTML=jpBanner()+`<div class="st">${G.status.map((s,i)=>`<i class="${s?'ok':''}">${NM[i]}:${s?'已完成':'排牌中'}</i>`).join('')}</div>`+
      mine.sub.map((l,k)=>`<div class="lane"><div class="lh"><span>${LN[k]}</span><b>${CAT[catOf(ev(l))]}</b></div><div class="g5">${l.map(x=>mini(x)).join('')}</div></div>`).join('')+'<p class="rule">'+(mine.want?'⚔ 對決模式:':'')+'已完成,等待其他玩家…</p>'+(G.status.includes(0)?`<div class="pb"><div class="rule">催一下還沒完成的玩家:</div><div class="row">${URGE.map((t,k)=>`<button style="flex:1 1 30%;font-size:13px" ${G.urgeOff?'disabled':''} onclick="sendUrge(${k})">${t}</button>`).join('')}</div><div class="row"><input id="utx" maxlength="30" placeholder="自己輸入想說的話(最多 30 字)" value="${esc(G.urgeTxt||'')}" oninput="G.urgeTxt=this.value" onkeydown="if(event.key==='Enter')sendUrgeText()" style="${INP};flex:3;margin:0"><button ${G.urgeOff?'disabled':''} onclick="sendUrgeText()">送出</button></div></div>`:'');return}
    G.phase='play';laneFxCheck();oldRender();return}
  if(S.phase=='duel'){G.phase='duel';oldRender();return}
  if(S.phase=='result'){G.phase='result';G.res=compute();oldRender()}
}
/* ===== 表情攻擊 & 催促 ===== */
const URGE=['可以快點嗎？','全世界都在等你','我阿嬤都比你快'],sigSeen={};
function toast(html,cls){let c=document.getElementById('toast');if(!c){c=document.createElement('div');c.id='toast';document.body.appendChild(c)}
  const t=document.createElement('div');t.className='tt '+(cls||'');t.innerHTML=html;while(c.children.length>0)c.firstChild.remove();c.appendChild(t);setTimeout(()=>t.remove(),4200)}
function reactFx(kind,nm){
  const d=document.createElement('div'),r=(a,b)=>a+Math.random()*(b-a);d.className='rx '+kind;let h='';
  if(kind=='slipper')h=[[24,48,.9],[62,60,1.7],[40,72,2.5]].map(([x,y,t])=>`<i class="ck" style="left:${x}%;top:${y}%;--t:${t}s">🪳</i><i class="slp" style="left:${x}%;top:${y}%;--t:${t-.28}s">🩴</i><i class="bm" style="left:${x}%;top:${y}%;--t:${t}s">💥</i><b class="sq" style="left:${x}%;top:${y}%;--t:${t}s"></b>`).join('')+`<div class="lab">${nm} 拿拖鞋打蟑螂!<br>啪!啪!啪!</div>`;
  else if(kind=='fart')h=Array.from({length:14},()=>`<i class="pf" style="left:${r(0,90)}%;--d:${r(0,1.2)}s;--s:${r(30,70)}px">💨</i>`).join('')+`<div class="lab">${nm} 對你放了一個屁<br>噗~~~</div>`;
  else h=Array.from({length:10},()=>`<i class="dr" style="left:${r(0,92)}%;--d:${r(0,1)}s;--s:${r(28,60)}px">💦</i>`).join('')+Array.from({length:4},()=>`<b class="bl" style="left:${r(5,80)}%;top:${r(5,50)}%;--s:${r(60,120)}px;--d:${r(0,.6)}s"></b>`).join('')+`<div class="lab">${nm} 對你吐了口水<br>呸!</div>`;
  d.innerHTML=h;document.body.appendChild(d);
  if(kind=='slipper'){const a=document.getElementById('app');[900,1700,2500].forEach(T=>setTimeout(()=>{a.classList&&a.classList.add('shk');setTimeout(()=>a.classList&&a.classList.remove('shk'),450)},T))}
  try{navigator.vibrate&&navigator.vibrate(kind=='slipper'?[1,899,60,740,60,740,60]:[60,40,60])}catch(_){}
  setTimeout(()=>d.remove(),kind=='slipper'?3900:3000)}
function sendUrgeText(){const t=(G.urgeTxt||'').trim().slice(0,30);if(!t||G.urgeOff)return;G.urgeOff=true;G.urgeTxt='';
  pdoc(uid).update({sig:{t:'urge',k:-1,txt:t,to:'*',n:Date.now()+Math.random()}}).catch(()=>{});
  toast('✓ 已通知所有還沒完成的玩家','ok');setTimeout(()=>{G.urgeOff=false;render()},5000);render()}
function handleSig(id,sg){const nm=esc((P[id]&&P[id].name)||'?');
  if(sg.t=='react'&&sg.to==uid)reactFx(sg.k,nm);
  else if(sg.t=='urge'&&S.phase=='play'&&G.me>=0&&!(pd(uid)&&pd(uid).sub))toast('⏰ '+nm+':'+esc(sg.k>=0?(URGE[sg.k]||''):String(sg.txt||'').slice(0,30)))}
function scanSigs(){Object.keys(P).forEach(id=>{if(id==uid)return;const sg=P[id].sig,cur=sg?sg.n:0;
  if(!(id in sigSeen)){sigSeen[id]=cur;return}
  if(cur&&cur!==sigSeen[id]){sigSeen[id]=cur;handleSig(id,sg)}})}
function sendReact(seat,kind){const id=S.order[seat];if(!id||Date.now()-(G.rxAt||0)<1500)return;G.rxAt=Date.now();
  pdoc(uid).update({sig:{t:'react',k:kind,to:id,n:Date.now()+Math.random()}}).catch(()=>{});
  toast('✓ 已對 '+NM[seat]+' 送出 '+({slipper:'🩴',fart:'💨',spit:'💦'})[kind],'ok')}
function sendUrge(k){if(G.urgeOff)return;G.urgeOff=true;
  pdoc(uid).update({sig:{t:'urge',k,to:'*',n:Date.now()+Math.random()}}).catch(()=>{});
  toast('✓ 已通知所有還沒完成的玩家','ok');setTimeout(()=>{G.urgeOff=false;render()},5000);render()}
function summary(R,i){let h=summary0(R,i);if(i==G.me||G.me<0||(P[S.order[i]]&&P[S.order[i]].bot))return h;
  const p=R.pairs.find(p=>(p.a==G.me&&p.b==i)||(p.a==i&&p.b==G.me));if(!p||(p.a==G.me?p.s:-p.s)>=0)return h;
  return h+`<div class="sum">😤 對 ${NM[i]} 表達不爽:</div><div class="row" style="margin:0 0 6px">${[['slipper','🩴 拖鞋'],['fart','💨 放屁'],['spit','💦 口水']].map(([k,t])=>`<button style="padding:6px;font-size:14px" onclick="sendReact(${i},'${k}')">${t}</button>`).join('')}</div>`}

init();
</script>
