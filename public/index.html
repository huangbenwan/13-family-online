<style>

.lane{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px;margin:6px 0}

.badge.hot{background:linear-gradient(135deg,#ff6b6b,#c62828);color:#fff;box-shadow:0 0 8px #ff5a5a99}
.pb.vip{border-color:#d9a21b;box-shadow:0 0 0 1px #d9a21b,0 0 14px #f0c04066}

.sm .c.gold{background:linear-gradient(180deg,#fff6cc,#f2cd60);border-color:#c8921a;animation:shine 2s infinite}

.op i{width:17px;height:17px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:9px;color:#fff}
.op.win{background:#1f6f4a22;color:var(--acc)}.op.win i{background:var(--acc)}
.op.lose{background:#c6282822;color:var(--red)}.op.lose i{background:var(--red)}
.op.tie{background:var(--line);color:var(--mut)}.op.tie i{background:var(--mut)}
button.duel{background:linear-gradient(135deg,#f9dc7a,#d9a21b);color:#3a2800;border:0;font-weight:800}
.fx{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#000b 30%,#000e);animation:fxin .3s;overflow:hidden}
.rays{position:absolute;width:160vmax;height:160vmax;background:repeating-conic-gradient(from 0deg,#f7d77455 0 8deg,transparent 8deg 20deg);animation:spin 6s linear infinite;-webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%)}
.fx.royal .rays{background:repeating-conic-gradient(from 0deg,#ff5a5a77 0 8deg,#f7d77477 8deg 12deg,transparent 12deg 24deg)}
.fxbox{position:relative;text-align:center;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}

.fx.royal h2{background:linear-gradient(180deg,#fff,#ffb4a8 45%,#e53935);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 16px #ff5a5a)}
.fxbox small{display:block;font-size:14px;letter-spacing:3px;color:#f7d774}
.sp{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);background:radial-gradient(circle,#fff,#f7d774 50%,transparent 70%);border-radius:50%;animation:tw 1.2s var(--d) infinite}
@keyframes fxin{from{opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.2) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes tw{0%,100%{transform:scale(0);opacity:0}50%{transform:scale(1);opacity:1}}
.sm .c.back{background:repeating-linear-gradient(45deg,#2a4d3a 0 4px,#356b50 4px 8px);border-color:#1f6f4a}
.sm .c.back b,.sm .c.back span{visibility:hidden}
.sm.hid.mine{cursor:pointer}.sm.hid.mine .c.back{animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 10px var(--acc)}}
@keyframes flip{from{transform:rotateY(90deg)}}.sm.new .c{animation:flip .5s}
</style></head><body>
<div class="bar"><h1>♠ 五人十三支 Online</h1><span id="tot"></span></div>
<div id="app"></div>
<script>
const SU=['♠','♥','♦','♣'],CAT=['散牌','一對','兩對','三條','順子','同花','同花對子','同花兩對子','葫蘆','四條','同花順','五雷'];
const LN=['頭墩','中墩','尾墩'],LS=[3,5,5],NM=['你','小明','阿花','老王','小美'];
const lb=r=>({11:'J',12:'Q',13:'K',14:'A'}[r]||r),P5=759375;
function ev(cs){
  const n=cs.length,cnt={};cs.forEach(c=>cnt[c.r]=(cnt[c.r]||0)+1);
  const g=Object.entries(cnt).map(([r,c])=>[+r,c]).sort((a,b)=>b[1]-a[1]||b[0]-a[0]);
  let rk=g.map(x=>x[0]),cn=g.map(x=>x[1]).join(''),cat=0;
  if(n==5){
    const fl=cs.every(c=>c.s==cs[0].s),rs=cs.map(c=>c.r).sort((a,b)=>b-a);
    let st=g.length==5&&rs[0]-rs[4]==4;
    if(g.length==5&&rs.join()=='14,5,4,3,2'){st=true;rk=[5]}else if(st)rk=[rs[0]];
    cat=cn=='5'?11:st&&fl?10:cn=='41'?9:cn=='32'?8:fl&&cn=='221'?7:fl&&cn=='2111'?6:fl?5:st?4:cn=='311'?3:cn=='221'?2:cn=='2111'?1:0;
  }else cat=cn=='3'?3:cn=='21'?1:0;
  if([3,8,9,11].includes(cat))rk=[rk[0]]; // 只比主要點數
  let v=cat;for(let i=0;i<5;i++)v=v*15+(rk[i]||0);return v;
}
const catOf=v=>Math.floor(v/P5);
const C5=[];for(let m=0;m<8192;m++){let k=0;for(let i=0;i<13;i++)k+=m>>i&1;if(k==5)C5.push(m)}
function auto(h){
  const pick=m=>h.filter((_,i)=>m>>i&1),v5=C5.map(m=>ev(pick(m))),f3={};
  for(const strict of [1,0]){
    let best=null,bs=-1;
    for(let a=0;a<C5.length;a++)for(let b=0;b<C5.length;b++){
      if(C5[a]&C5[b])continue;const fm=8191^C5[a]^C5[b];
      const vf=f3[fm]??=ev(pick(fm)),vt=v5[a],vm=v5[b];
      if(strict?!(vt>vm&&vm>vf):!(vt>=vm&&vm>=vf))continue;
      const s=vt+vm+vf*2;if(s>bs){bs=s;best=[fm,C5[b],C5[a]]}
    }
    if(best)return best.map(pick);
  }
}
function deck(){const d=[];let id=0;for(let s=0;s<4;s++)for(let k=0;k<(s==G.dbl?2:1);k++)for(let r=2;r<=14;r++)d.push({r,s,id:id++});
  for(let i=d.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[d[i],d[j]]=[d[j],d[i]]}return d}
const chip=(c,x='')=>`<div class="c ${c.s==1||c.s==2?'r':''}${c.r==G.jr?" jk":""}" ${x}><b>${lb(c.r)}</b><span>${SU[c.s]}</span></div>`;
const mini=(c,h)=>`<div class="c ${c.s==1||c.s==2?'r':''} ${h?'gold':''}"><b>${lb(c.r)}</b><span>${SU[c.s]}</span></div>`;

let G={round:0,n:5,total:[],sortMode:'rank',asc:false,sel:null,dbl:0,jr:0};
function sortHand(){const h=G.hand;if(G.sortMode=='manual')return;
  if(G.sortMode=='suit')h.sort((a,b)=>a.s-b.s||b.r-a.r);
  else h.sort((a,b)=>(G.asc?a.r-b.r:b.r-a.r)||a.s-b.s)}
function start(n){if(n){G.n=n;G.dbl=0}if(!G.round||n)G.total=Array(G.n).fill(0);
  const d=deck();G.round++;G.jr=2+Math.floor(Math.random()*13);G.swapUsed=false;G.swapMsg='';clearInterval(G.dvTimer);G.duel=false;G.dv=null;G.fxQ=[];G.fxBusy=false;G.hands=[];
  for(let i=0;i<G.n;i++)G.hands.push(d.slice(i*13,i*13+13));
  G.idle=65-G.n*13;G.hand=G.hands[0].slice();G.lanes=[[],[],[]];G.sel=null;G.res=null;
  G.status=Array(G.n).fill(0);G.bots={};G.phase='play';sortHand();render();
  const rid=G.round;
  for(let i=1;i<G.n;i++)setTimeout(()=>{if(G.round!=rid)return;G.bots[i]=auto(G.hands[i]);G.status[i]=1;check();render()},500*i+300);
}
function inLane(id){return G.lanes.some(l=>l.some(c=>c.id==id))}
function place(l,id){const c=G.hand.find(x=>x.id==id);if(!c||G.lanes[l].length>=LS[l])return;
  G.hand=G.hand.filter(x=>x.id!=id);G.lanes[l].push(c);G.sel=null;render()}
function back(l,id){const c=G.lanes[l].find(x=>x.id==id);G.lanes[l]=G.lanes[l].filter(x=>x.id!=id);G.hand.push(c);sortHand();render()}
function selCard(id){G.sel=G.sel==id?null:id;render()}
function laneClick(l){if(G.sel!=null)place(l,G.sel)}
function setSort(m){if(G.sortMode==m&&m=='rank')G.asc=!G.asc;G.sortMode=m;sortHand();render()}
function moveSel(d){const i=G.hand.findIndex(c=>c.id==G.sel),j=i+d;if(i<0||j<0||j>=G.hand.length)return;
  [G.hand[i],G.hand[j]]=[G.hand[j],G.hand[i]];G.sortMode='manual';render()}
function moveBefore(id,tid){const c=G.hand.find(x=>x.id==id);if(!c||id==tid)return;
  G.hand=G.hand.filter(x=>x.id!=id);G.hand.splice(G.hand.findIndex(x=>x.id==tid),0,c);G.sortMode='manual';render()}
const QK={五輪:[[1],[2],[2]],四輪:[[1],[1],[2]],三輪:[[1],[1],[1]],雙色:[[0,1,3],[5,6,7],[5,6,7]]};
function shape(h,ok){
  const pick=m=>h.filter((_,i)=>m>>i&1),v5=C5.map(m=>ev(pick(m))),f3={};let best=null,bs=-1;
  for(let a=0;a<C5.length;a++){if(!ok[2].includes(catOf(v5[a])))continue;
    for(let b=0;b<C5.length;b++){
      if(C5[a]&C5[b]||!ok[1].includes(catOf(v5[b])))continue;const fm=8191^C5[a]^C5[b];
      const vf=f3[fm]??=ev(pick(fm)),vt=v5[a],vm=v5[b];
      if(!ok[0].includes(catOf(vf))||!(vt>vm&&vm>vf))continue;
      const s=vt+vm+vf*2;if(s>bs){bs=s;best=[fm,C5[b],C5[a]]}}}
  return best&&best.map(pick)}
function quick(k){const r=shape(G.hands[0],QK[k]);
  if(!r){G.note='牌型不符:這手牌湊不成「'+k+'」';const id=G.round;setTimeout(()=>{if(G.round==id&&G.note){G.note='';render()}},3000);render();return}
  G.note='';G.lanes=r;G.hand=[];G.sel=null;render()}
function clr(){G.lanes.flat().forEach(c=>G.hand.push(c));G.lanes=[[],[],[]];sortHand();render()}
function hint(){const a=auto(G.hands[0]);G.lanes=a;G.hand=[];G.sel=null;render()}
function legal(){
  if(G.hand.length)return'還有 '+G.hand.length+' 張牌未放入三墩';
  for(let i=0;i<3;i++)if(G.lanes[i].length!=LS[i])return'各墩張數需為 3／5／5';
  const [h,m,t]=G.lanes.map(ev);
  if(!(m>h))return'倒水:中墩牌力需大於頭墩';if(!(t>m))return'倒水:尾墩牌力需大於中墩';return''}
function submit(){if(legal())return;G.duel=false;G.status[0]=1;G.phase='wait';check();render()}
function check(){if((G.phase=='play'||G.phase=='wait')&&G.status.every(x=>x)&&G.lanes.flat().length==13){G.duel?startDuel():finish()}}
const BASE=50;
function spec(v,k){const c=catOf(v);if(k==0)return c==3?{n:'衝三',m:1}:null;
  return c==11?{n:'五雷',m:5}:c==10?{n:'同花順',m:1}:c==9?{n:'鐵支',m:1}:null}
function finish(){
  const N=G.n,L=G.hands.map((_,i)=>i==0?G.lanes:G.bots[i]),V=L.map(l=>l.map(ev)),sc=Array(N).fill(0),pairs=[];
  const JM=L.map(l=>l.map(c=>{const n=c.filter(x=>x.r==G.jr).length;return n>=5?3:n==4?2:n==3?1:0}));
  const sw=Array.from({length:N},()=>Array(N).fill(false)),RS={};
  for(let a=0;a<N;a++)for(let b=a+1;b<N;b++){
    const r=[0,1,2].map(k=>Math.sign(V[a][k]-V[b][k]));RS[a+','+b]=r;
    if(r.every(x=>x==1))sw[a][b]=true;else if(r.every(x=>x==-1))sw[b][a]=true}
  const hong=sw.map(row=>N>=3&&row.filter(Boolean).length==N-1);
  for(let a=0;a<N;a++)for(let b=a+1;b<N;b++){
    const items=[];
    if(sw[a][b]||sw[b][a]){const w=sw[a][b]?a:b;items.push({w,t:'帕嘎'+(hong[w]?'(紅不讓×3)':''),s:BASE*(hong[w]?3:1)})}
    for(let k=0;k<3;k++){
      const sa=spec(V[a][k],k),sb=spec(V[b][k],k);
      if(sa&&sb){const d=Math.sign(V[a][k]-V[b][k]);if(d){const sp=d>0?sa:sb;items.push({w:d>0?a:b,t:LN[k]+sp.n,s:BASE*sp.m})}}
      else if(sa)items.push({w:a,t:LN[k]+sa.n,s:BASE*sa.m});
      else if(sb)items.push({w:b,t:LN[k]+sb.n,s:BASE*sb.m});
      const ja=JM[a][k],jb=JM[b][k],jt=m=>LN[k]+'彩金'+lb(G.jr)+(m>1?'×'+m:'');
      if(ja&&!jb)items.push({w:a,t:jt(ja),s:BASE*ja});else if(jb&&!ja)items.push({w:b,t:jt(jb),s:BASE*jb});
    }
    const net=items.reduce((x,i)=>x+(i.w==a?i.s:-i.s),0);
    sc[a]+=net;sc[b]-=net;pairs.push({a,b,r:RS[a+','+b],items,s:net})}
  sc.forEach((s,i)=>G.total[i]+=s);G.res={L,V,sc,pairs,hong,JM,jr:G.jr};
  const mn=Math.min(...G.total);G.swapMsg='';G.swapUsed=false;
  if(mn<0&&G.total[0]!=mn&&Math.random()<.5){const ls=G.total.map((t,i)=>t==mn?i:-1).filter(i=>i>0),w=ls[0|Math.random()*ls.length],ns=[0,1,2,3].filter(x=>x!=G.dbl),s2=ns[0|Math.random()*ns.length];
    G.dbl=s2;G.swapUsed=true;G.swapMsg=`🔄 ${NM[w]}(總分最低)要求換色:${SU[s2]} 改為 2 副,下一局生效`}
  G.phase='result'}
function hiIds(c,k){const v=ev(c),cat=catOf(v);if(!spec(v,k))return new Set();
  if(cat==9){const n={};c.forEach(x=>n[x.r]=(n[x.r]||0)+1);return new Set(c.filter(x=>n[x.r]==4).map(x=>x.id))}
  return new Set(c.map(x=>x.id))}
function summary(R,i){
  const W=[],Lo=[],T=[];
  R.pairs.forEach(p=>{if(p.a!=i&&p.b!=i)return;const o=p.a==i?p.b:p.a,n=p.a==i?p.s:-p.s;(n>0?W:n<0?Lo:T).push([o,n])});
  const ch=(a,c,ic,sg)=>a.map(([o,n])=>`<span class="op ${c}"><i>${ic}</i>${NM[o]}${n?' '+sg+Math.abs(n):''}</span>`).join('')||'<span class="rule">—</span>';
  return `<div class="sum"><div>🏆 贏 ${ch(W,'win','▲','+')}</div><div>💔 輸 ${ch(Lo,'lose','▼','−')}</div>${T.length?`<div>🤝 平 ${ch(T,'tie','–','')}</div>`:''}</div>`}
function compStr(){return SU.map((x,i)=>x+(i==G.dbl?2:1)).join(' ')}
function jpBanner(){return `<div class="jp">🎰 本局彩金:<b>${lb(G.jr)}</b><span>同墩 3/4/5 張彩金牌 = 每位對手付 ×1/×2/×3 底注</span><small>本局牌組 ${compStr()}</small></div>`}
function doSwap(s){G.dbl=s;G.swapUsed=true;G.swapMsg='🔄 你(總分最低)要求換色:'+SU[s]+' 改為 2 副,下一局生效';render()}
function swapPanel(){
  let h=G.swapMsg?`<div class="pb">${G.swapMsg}<br><span class="rule">下一局牌組 ${compStr()}</span></div>`:'';
  const min=Math.min(...G.total);
  if(min<0&&G.total[0]==min&&!G.swapUsed)h+=`<div class="pb"><b>🔄 輸家要求換色</b><div class="rule">你目前總分最低,可把雙副花色改成別的花色(下一局生效,發牌仍為亂數)。目前:${compStr()}</div><div class="row">${[0,1,2,3].filter(x=>x!=G.dbl).map(x=>`<button onclick="doSwap(${x})">${SU[x]} 改為兩副</button>`).join('')}</div></div>`;
  return h}
const Ls=i=>i?G.bots[i]:G.lanes;
function fxParts(l,k){const p=[],sp=spec(ev(l),k);if(sp)p.push(sp.n);

function connectDb(){return new Promise(resolve=>{
  const cid='c'+Math.random().toString(36).slice(2),subs=new Map();let n=0,done=false;
  const es=new EventSource('/events?cid='+cid);
  const post=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json());
  const op=(o,path,data)=>post('/op',{op:o,path,data}).then(r=>{if(!r.ok)throw{code:r.code||'error',message:r.error||'error'};return r});
  const cl=x=>x==null?undefined:JSON.parse(JSON.stringify(x));
  const dsnap=(path,m)=>({id:path.split('/').pop(),exists:!!m.exists,data:()=>m.exists?cl(m.data):undefined});
  const csnap=m=>{const docs=m.docs.map(d=>({id:d.id,exists:true,data:()=>cl(d.data)}));return{docs,size:docs.length,empty:!docs.length}};
  es.addEventListener('snap',e=>{const m=JSON.parse(e.data),s=subs.get(m.sub);if(s)s.cb(m.kind=='doc'?dsnap(s.path,m):csnap(m))});
  es.addEventListener('hello',()=>{subs.forEach((s,id)=>post('/sub',{cid,id,kind:s.kind,path:s.path}));if(!done){done=true;resolve(db)}});
  const sub=(kind,path,cb)=>{const id='s'+(++n);subs.set(id,{kind,path,cb});post('/sub',{cid,id,kind,path}).catch(()=>{});return()=>{subs.delete(id);post('/unsub',{cid,id}).catch(()=>{})}};
  const db={
    doc:path=>({id:path.split('/').pop(),path,get:()=>op('get',path).then(r=>dsnap(path,r)),set:d=>op('set',path,d).then(()=>{}),update:d=>op('update',path,d).then(()=>{}),delete:()=>op('delete',path).then(()=>{}),onSnapshot:(cb)=>sub('doc',path,cb)}),
    collection:path=>({path,get:()=>op('list',path).then(csnap),onSnapshot:(cb)=>sub('col',path,cb)})};
  setTimeout(()=>{if(!done){done=true;resolve(null)}},60000);
})}

    if(r.every(x=>x==1))sw[a][b]=true;else if(r.every(x=>x==-1))sw[b][a]=true}
  const hong=sw.map(row=>N>=3&&row.filter(Boolean).length==N-1);
  for(let a=0;a<N;a++)for(let b=a+1;b<N;b++){const items=[];
    if(sw[a][b]||sw[b][a]){const w=sw[a][b]?a:b;items.push({w,t:'帕嘎'+(hong[w]?'(紅不讓×3)':''),s:BASE*(hong[w]?3:1)})}
    for(let k=0;k<3;k++){const sa=spec(V[a][k],k),sb=spec(V[b][k],k);
      if(sa&&sb){const d=Math.sign(V[a][k]-V[b][k]);if(d){const sp=d>0?sa:sb;items.push({w:d>0?a:b,t:LN[k]+sp.n,s:BASE*sp.m})}}
      else if(sa)items.push({w:a,t:LN[k]+sa.n,s:BASE*sa.m});else if(sb)items.push({w:b,t:LN[k]+sb.n,s:BASE*sb.m});
      const ja=JM[a][k],jb=JM[b][k],jt=m=>LN[k]+'彩金'+lb(S.jr)+(m>1?'×'+m:'');
      if(ja&&!jb)items.push({w:a,t:jt(ja),s:BASE*ja});else if(jb&&!ja)items.push({w:b,t:jt(jb),s:BASE*jb})}
    const net=items.reduce((x,i)=>x+(i.w==a?i.s:-i.s),0);sc[a]+=net;sc[b]-=net;pairs.push({a,b,r:RS[a+','+b],items,s:net})}
  return{L,V,sc,pairs,hong,JM,jr:S.jr}}
async function finishRound(){if(flag('done'+S.round))return;
  try{const R=compute(),order=S.order,total={...(S.total||{})};order.forEach((id,i)=>total[id]=(total[id]||0)+R.sc[i]);
    const mn=Math.min(...order.map(id=>total[id])),up={phase:'result',total,swapMsg:'',swapUsed:false};
    const lo=order.filter(id=>total[id]==mn);
    if(mn<0&&lo.every(id=>P[id]&&P[id].bot)&&Math.random()<.5){const w=lo[0|Math.random()*lo.length],ns=[0,1,2,3].filter(x=>x!=S.dbl),s2=ns[0|Math.random()*ns.length];
      up.dbl=s2;up.swapUsed=true;up.swapMsg=`🔄 ${esc(P[w].name)}(總分最低)要求換色:${SU[s2]} 改為 2 副,下一局生效`}
    await ctl().update(up)}catch(e){say('結算失敗:'+(e.message||e.code))}}
async function deal(){
  const ids=Object.keys(P).sort((a,b)=>P[a].t-P[b].t).slice(0,5);if(ids.length<2||S.host!=uid)return;
  const d=deck(),hands={};ids.forEach((id,i)=>hands[id]=d.slice(i*13,i*13+13));const round=(S.round||0)+1;
  try{await ctl().update({phase:'play',round,order:ids,hands,jr:2+(0|Math.random()*13),idle:65-ids.length*13,swapMsg:'',swapUsed:false});
    ids.forEach((id,i)=>{if(!P[id].bot)return;setTimeout(()=>{if(S&&S.round==round)pdoc(id).update({round,sub:auto(hands[id]),want:0,rev:[0,0,0]}).catch(()=>{})},600*(i+1))})}
  catch(e){say('發牌失敗:'+(e.message||e.code))}}
async function addBot(){const n=Object.values(P).filter(p=>p.bot).length+1;if(Object.keys(P).length>=5)return;
  await db.doc('rooms/'+code+'/p/bot'+Date.now()+Math.random().toString(36).slice(2,5)).set({name:'電腦'+n,t:Date.now(),bot:true,round:-1,sub:null,want:0,rev:[0,0,0]})}
async function kick(id){await pdoc(id).delete()}
async function submit(){if(legal())return;try{await pdoc(uid).update({round:S.round,sub:G.lanes,want:0,rev:[0,0,0]})}catch(e){G.note='送出失敗:'+(e.message||e.code);render()}}
async function duelGo(){if(legal())return;try{await pdoc(uid).update({round:S.round,sub:G.lanes,want:1,rev:[0,0,0]})}catch(e){G.note='送出失敗:'+(e.message||e.code);render()}}
function reveal(i,k){if(i!=G.me||!S||S.phase!='duel')return;const d=pd(uid);G.rv=G.rv||{};const rv=(G.rv[S.round]||(d?d.rev:[0,0,0])).slice();if(!d||rv[k])return;rv[k]=1;G.rv[S.round]=rv;pdoc(uid).update({rev:rv}).catch(()=>{})}
function skipDuel(){if(S.host==uid)finishRound()}
function doSwap(x){ctl().update({dbl:x,swapUsed:true,swapMsg:`🔄 ${NM[G.me]}(總分最低)要求換色:${SU[x]} 改為 2 副,下一局生效`})}
function swapPanel(){let h=G.swapMsg?`<div class="pb">${G.swapMsg}<br><span class="rule">下一局牌組 ${compStr()}</span></div>`:'';
  const mn=Math.min(...G.total);
  if(mn<0&&G.me>=0&&G.total[G.me]==mn&&!G.swapUsed)h+=`<div class="pb"><b>🔄 輸家要求換色</b><div class="rule">你目前總分最低,可把雙副花色改成別的花色(下一局生效)。目前:${compStr()}</div><div class="row">${[0,1,2,3].filter(x=>x!=G.dbl).map(x=>`<button onclick="doSwap(${x})">${SU[x]} 改為兩副</button>`).join('')}</div></div>`;
  return h}
function nextBtn(){return (S.host==uid?'<div class="row"><button class="p" onclick="deal()">下一局</button>':'<p class="rule">等房主開始下一局…</p><div class="row">')+'<button onclick="leaveRoom()">離開房間</button></div>'}
function duelHTML(){
  return jpBanner()+'<div class="rule">⚔ 對決模式:點你自己的牌墩,自己決定攤牌順序(把最強的留到最後)。</div>'+
  S.order.map((_,i)=>`<div class="pb"><h3><span>${NM[i]}${i==G.me?'(你)':''}</span><span class="rule">已攤 ${revOf(i).filter(Boolean).length}/3</span></h3>`+[0,1,2].map(k=>{
    const l=subOf(i)[k],r=revOf(i)[k],pad='<span></span>'.repeat(5-l.length);
    if(r){const hs=hiIds(l,k);if(fxParts(l,k).some(t=>t.startsWith('彩金')))l.forEach(x=>{if(x.r==G.jr)hs.add(x.id)});
      return `<div class="sm ${G.last==i+','+k?'new':''}">${l.map(x=>mini(x,hs.has(x.id))).join('')}${pad}<em class="${fxParts(l,k).length?'gl':''}">${LN[k]}<br>${CAT[catOf(ev(l))]}</em></div>`}
    const me=i==G.me;return `<div class="sm hid ${me?'mine':''}" ${me?`onclick="reveal(${i},${k})"`:''}>${l.map(back5).join('')}${pad}<em>${LN[k]}<br>${me?'點我攤牌'+(fxParts(l,k).length?' ✦':''):'未攤牌'}</em></div>`}).join('')+'</div>').join('')+
  (S.host==uid?'<div class="row"><button onclick="skipDuel()">全部攤開(房主)</button></div>':'')}
function lobbyHTML(){const ids=Object.keys(P).sort((a,b)=>P[a].t-P[b].t),host=S.host==uid;
  return `<div class="jp" style="justify-content:space-between"><span>房間代碼</span><b style="font-size:30px;letter-spacing:6px">${code}</b><small>朋友打開同一個網址後輸入代碼</small></div>
<div class="pb"><h3><span>玩家(${ids.length}/5)</span></h3>${ids.map(id=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0"><span>${esc(P[id].name)}${P[id].bot?' 🤖':''}${id==S.host?' 👑':''}${id==uid?' (你)':''}</span>${host&&id!=uid?`<button style="flex:none;padding:2px 10px" onclick="kick('${id}')">✕</button>`:''}</div>`).join('')}</div>
${host?`<div class="row"><button onclick="addBot()" ${ids.length>=5?'disabled':''}>＋ 加入電腦</button><button class="p" onclick="deal()" ${ids.length<2?'disabled':''}>開始遊戲</button></div>`:'<p class="rule">等待房主開始遊戲…</p>'}
<div class="row"><button onclick="leaveRoom()">離開房間</button></div><p class="rule">目前牌組 ${compStr()}。房主需保持頁面開啟(負責發牌與結算)。</p>`}
function render(){
  const app=document.getElementById('app'),T=document.getElementById('tot');
  if(!S){T.textContent='';app.innerHTML=entryHTML();return}
  T.textContent='房間 '+code+' · 第 '+S.round+' 局';
  if(S.phase=='lobby'){app.innerHTML=lobbyHTML();return}
  if(G.me<0){app.innerHTML='<p>這一局已開始,你不在名單內。請等下一局或請房主重新開局。</p><div class="row"><button onclick="leaveRoom()">離開房間</button></div>';return}
  const mine=pd(uid);G.status=S.order.map(id=>pd(id)&&pd(id).sub?1:0);
  if(S.phase=='play'){
    if(mine&&mine.sub){app.innerHTML=jpBanner()+`<div class="st">${G.status.map((s,i)=>`<i class="${s?'ok':''}">${NM[i]}:${s?'已完成':'排牌中'}</i>`).join('')}</div>`+
      mine.sub.map((l,k)=>`<div class="lane"><div class="lh"><span>${LN[k]}</span><b>${CAT[catOf(ev(l))]}</b></div><div class="g5">${l.map(x=>mini(x)).join('')}</div></div>`).join('')+'<p class="rule">'+(mine.want?'⚔ 對決模式:':'')+'已完成,等待其他玩家…</p>';return}
    G.phase='play';oldRender();return}
  if(S.phase=='duel'){G.phase='duel';oldRender();return}
  if(S.phase=='result'){G.phase='result';G.res=compute();oldRender()}
}
init();
</script>
